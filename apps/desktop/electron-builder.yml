appId: io.github.dayancabrera2003.orquestador
productName: Orquestador
executableName: orquestador
copyright: Copyright © 2026 Dayan Cabrera
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - '!out/**/*.map'
  - package.json
extraResources:
  - from: ../web/dist
    to: renderer
# Binarios nativos y la CLI del agente deben vivir fuera del asar para poder ejecutarse.
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
linux:
  target: [AppImage, deb]
  executableName: orquestador
  syncDesktopName: true
  category: Development
  maintainer: Dayan Cabrera <DayanCabrera2003@users.noreply.github.com>
  synopsis: Orquestador de sesiones de agentes de código
deb:
  packageName: orquestador
mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: DayanCabrera2003
  repo: orquestador
